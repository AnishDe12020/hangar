config-version = 2
start-at-login = true
auto-reload-config = true
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'
accordion-padding = 20
persistent-workspaces = ['W','B','S','M']
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

on-window-detected = [
  { if = 'test %{app-bundle-id} = local.leanmac.picker', run = 'layout floating' },
  { if = 'test %{app-bundle-id} = com.apple.systempreferences', run = 'layout floating' },
  { if = 'test %{app-bundle-id} = cc.ffitch.shottr', run = 'layout floating' },
  { if = 'test %{app-bundle-id} = org.hammerspoon.Hammerspoon', run = 'layout floating' },
  { if = 'test %{app-bundle-id} = com.stonerl.Thaw', run = 'layout floating' },
  { if = 'test %{app-bundle-id} = com.1password.1password', run = 'layout floating' },
  { if = 'test %{app-bundle-id} = com.openai.codex', run = 'move-node-to-workspace W' },
  { if = 'test %{app-bundle-id} = com.openai.chat', run = 'move-node-to-workspace W' },
  { if = 'test %{app-bundle-id} = com.anthropic.claudefordesktop', run = 'move-node-to-workspace W' },
  { if = 'test %{app-bundle-id} = com.mitchellh.ghostty', run = 'move-node-to-workspace W' },
  { if = 'test %{app-bundle-id} = com.googlecode.iterm2', run = 'move-node-to-workspace W' },
  { if = 'test %{app-bundle-id} = dev.warp.Warp-Stable', run = 'move-node-to-workspace W' },
  { if = 'test %{app-bundle-id} = com.microsoft.VSCode', run = 'move-node-to-workspace W' },
  { if = 'test %{app-bundle-id} = com.todesktop.230313mzl4w4u92', run = 'move-node-to-workspace W' },
  { if = 'test %{app-bundle-id} = dev.zed.Zed', run = 'move-node-to-workspace W' },
  { if = 'test %{app-bundle-id} = md.obsidian', run = 'move-node-to-workspace W' },
  { if = 'test %{app-bundle-id} = com.google.Chrome', run = 'move-node-to-workspace B' },
  { if = 'test %{app-bundle-id} = company.thebrowser.dia', run = 'move-node-to-workspace B' },
  { if = 'test %{app-bundle-id} = at.studio.AsideBrowser', run = 'move-node-to-workspace B' },
  { if = 'test %{app-bundle-id} = com.brave.Browser', run = 'move-node-to-workspace B' },
  { if = 'test %{app-bundle-id} = com.apple.Safari', run = 'move-node-to-workspace B' },
  { if = 'test %{app-bundle-id} = com.tinyspeck.slackmacgap', run = 'move-node-to-workspace S' },
  { if = 'test %{app-bundle-id} = com.hnc.Discord', run = 'move-node-to-workspace S' },
  { if = 'test %{app-bundle-id} = ru.keepcoder.Telegram', run = 'move-node-to-workspace S' },
  { if = 'test %{app-bundle-id} = net.whatsapp.WhatsApp', run = 'move-node-to-workspace S' },
  { if = 'test %{app-bundle-id} = com.spotify.client', run = 'move-node-to-workspace M' },
  { if = 'test %{app-bundle-id} = org.videolan.vlc', run = 'move-node-to-workspace M' },
  { if = 'test %{app-bundle-id} = com.firecore.infuse', run = 'move-node-to-workspace M' },
  { if = 'test %{app-bundle-id} = com.amazon.aiv.AIVApp', run = 'move-node-to-workspace M' },
  { if = 'test %{app-bundle-id} = com.apple.iCal', run = 'move-node-to-workspace W' },
  { if = 'test %{app-bundle-id} = com.apple.finder', run = 'move-node-to-workspace W' }
]

[gaps]
inner.horizontal = 8
inner.vertical = 8
outer.left = 8
outer.right = 8
outer.top = 8
outer.bottom = 8

[workspace-to-monitor-force-assignment]
W = 'main'
B = 'main'
S = ['secondary','main']
M = ['secondary','main']

[mode.main.binding]
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'
alt-1 = 'workspace W'
alt-2 = 'workspace B'
alt-3 = 'workspace S'
alt-4 = 'workspace M'
alt-shift-1 = 'move-node-to-workspace W'
alt-shift-2 = 'move-node-to-workspace B'
alt-shift-3 = 'move-node-to-workspace S'
alt-shift-4 = 'move-node-to-workspace M'
alt-backtick = 'workspace-back-and-forth'
alt-comma = 'focus-monitor --wrap-around prev'
alt-period = 'focus-monitor --wrap-around next'
alt-shift-comma = 'move-node-to-monitor --focus-follows-window --wrap-around prev'
alt-shift-period = 'move-node-to-monitor --focus-follows-window --wrap-around next'
alt-f = 'fullscreen'
alt-shift-space = 'layout floating tiling'
alt-slash = 'layout tiles horizontal vertical'
alt-shift-slash = 'layout accordion horizontal vertical'
alt-minus = 'resize smart -50'
alt-equal = 'resize smart +50'
alt-shift-equal = 'balance-sizes'
alt-shift-r = 'reload-config'
f18 = 'workspace --wrap-around prev'
f19 = 'workspace --wrap-around next'
