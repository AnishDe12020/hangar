name: Isolated checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Lua runtime without launching Hammerspoon
        run: brew install --cask hammerspoon
      - name: Tests and native staging
        run: python3 tools/check.py --native
      - name: Build candidate archive
        run: python3 tools/package_release.py
